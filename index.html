<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>effectiveAF: Credit Card Perk Calculator</title>
    <meta
      name="description"
      content="Work out what your premium credit cards really cost after the perks you actually use. Free, private, runs entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="effectiveAF: Credit Card Perk Calculator" />
    <meta
      property="og:description"
      content="Value each credit the way you actually use it and see your card's effective annual fee. No accounts, no tracking."
    />
    <meta property="og:url" content="https://dnguyensr.github.io/effectiveAF/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('effectiveaf:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>effectiveAF needs JavaScript. All calculations run in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
