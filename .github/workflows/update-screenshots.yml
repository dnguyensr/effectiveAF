# Run manually (Actions → Update screenshots → Run workflow, pick a branch) to regenerate the
# Linux screenshot baselines and commit them back to that branch. Review the images in the PR.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  # To start CI afterwards: pushes made with GITHUB_TOKEN do not trigger workflows.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Must match the CI e2e container and @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=all
      - name: Commit changed baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update screenshot baselines"
            git push
          fi
      - name: Re-run CI on the updated branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}"
