# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploying is manual for now (early development: screenshots often need updating first).
  # Actions → CI → Run workflow → branch "main" → tick "Deploy to GitHub Pages".
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after the tests pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, licenses, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run coverage:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # Same image as `npm run test:e2e:docker`, so screenshot baselines match.
    # Keep this version in sync with @playwright/test in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check container matches installed Playwright
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.65.0" ]; then
            echo "::error::package.json has @playwright/test $installed but the CI container is 1.65.0. Update .github/workflows/ci.yml."
            exit 1
          fi
      - name: Functional and accessibility tests
        run: npx playwright test --grep-invert @visual
      # Screenshots are non-blocking while the views are still changing: a mismatch shows as a
      # warning (with diffs in the report artifact) instead of failing CI. Delete the
      # continue-on-error line once the views settle to make screenshots blocking again.
      - name: Screenshot comparisons (non-blocking)
        id: visual
        run: npx playwright test --grep @visual
        continue-on-error: true
      - name: Flag screenshot differences
        if: steps.visual.outcome == 'failure'
        run: echo "::warning::Screenshots differ from the baselines. Check the playwright-report artifact; run Update screenshots if the change is intended."
      - uses: actions/upload-artifact@v4
        if: failure() || steps.visual.outcome == 'failure'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [checks, e2e]
    # Only when started by hand with "deploy" ticked, on main. Pushes and the screenshot
    # workflow's CI re-run test but never deploy.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
